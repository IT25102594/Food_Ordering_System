<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBite - Login & Register</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* ==========================================================
           QuickBite design system
           Light: white + yellow   |   Dark: deep navy + light blue
           Every page links this file, so colors live in one place.
           ========================================================== */

        :root,
        [data-theme="light"] {
            --bg: #ffffff;
            --bg-tint: #fff9e0;            /* faint yellow wash for page backgrounds */
            --surface: #ffffff;
            --surface-2: #fff6d6;          /* hover / subtle fills */
            --text: #1d1b14;
            --text-sub: #6c6753;
            --border: #f0e4b8;
            --primary: #ffc21a;
            --primary-hover: #f2b200;
            --primary-grad: linear-gradient(135deg, #ffd24d, #ffb800);
            --on-primary: #1d1b14;         /* text that sits on top of the primary color */
            --primary-soft: rgba(255, 194, 26, 0.18);
            --link: #a56f00;               /* darker yellow so links stay readable on white */
            --danger: #d93a3a;
            --success: #1f9d55;
            --illus: rgba(240, 180, 20, 0.42);
            --shadow: 0 18px 50px rgba(120, 90, 0, 0.14);
            --radius: 16px;
        }

        [data-theme="dark"] {
            --bg: #080e1c;
            --bg-tint: #0d1730;
            --surface: #111a30;
            --surface-2: #1a2745;
            --text: #e9f0ff;
            --text-sub: #93a4c8;
            --border: #243257;
            --primary: #5cb8ff;
            --primary-hover: #82cbff;
            --primary-grad: linear-gradient(135deg, #3b82f6, #7dd3fc);
            --on-primary: #04111f;
            --primary-soft: rgba(92, 184, 255, 0.16);
            --link: #7cc6ff;
            --danger: #ff6b6b;
            --success: #4ade80;
            --illus: rgba(92, 184, 255, 0.2);
            --shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
        }

        /* ---------- base ---------- */
        html { color-scheme: light; }
        html[data-theme="dark"] { color-scheme: dark; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-font-smoothing: antialiased;
            transition: background 0.25s, color 0.25s;
        }
        a { color: var(--link); }
        .text-muted { color: var(--text-sub) !important; }
        :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

        /* ---------- buttons ---------- */
        .btn-brand {
            background: var(--primary-grad);
            color: var(--on-primary);
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: 700;
            width: 100%;
            transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
        }
        .btn-brand:hover { filter: brightness(1.05); transform: translateY(-1px); box-shadow: 0 8px 20px var(--primary-soft); color: var(--on-primary); }
        .btn-brand:active { transform: translateY(0); }

        /* ---------- form fields ---------- */
        .field-label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text); }
        .form-control {
            background-color: var(--surface);
            color: var(--text);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 11px 14px;
        }
        .form-control::placeholder { color: var(--text-sub); opacity: 0.7; }
        .form-control:focus {
            background-color: var(--surface);
            color: var(--text);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-soft);
        }

        /* ---------- theme toggle (sun / moon) ---------- */
        .theme-btn {
            width: 42px; height: 42px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: var(--surface);
            color: var(--text);
            border: 1.5px solid var(--border);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .theme-btn:hover { background: var(--surface-2); border-color: var(--primary); }
        .theme-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .theme-btn .icon-moon { display: none; }
        [data-theme="dark"] .theme-btn .icon-sun { display: none; }
        [data-theme="dark"] .theme-btn .icon-moon { display: block; }

    </style>
    <!-- sets the saved theme before the page paints, so there's no flash -->
    <script>
        /* QuickBite theme switcher
           Load this in the <head> (no defer) so the right theme is set before the page paints.
           Light is the default; the choice is saved under the same "theme" key the old pages used. */

        (function () {
            var saved = null;
            try { saved = localStorage.getItem('theme'); } catch (e) { /* storage blocked, fall back to light */ }
            document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
        })();

        function toggleTheme() {
            var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) { /* not a big deal if it can't save */ }
        }

        // any element with data-theme-toggle becomes a theme switch, so pages don't need their own wiring
        document.addEventListener('click', function (e) {
            if (e.target.closest('[data-theme-toggle]')) toggleTheme();
        });

    </script>

    <style>
        /* page layout: card centered over the food pattern */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                    radial-gradient(circle at 15% 20%, var(--primary-soft), transparent 45%),
                    radial-gradient(circle at 85% 80%, var(--primary-soft), transparent 45%),
                    var(--bg-tint);
        }

        /* food doodles scattered behind the card */
        .food-bg { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
        .food { position: absolute; color: var(--illus); }

        .top-actions { position: fixed; top: 20px; right: 20px; z-index: 5; }

        .auth-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 36px 32px 32px;
            box-shadow: var(--shadow);
            animation: rise 0.5s ease both;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) { .auth-card { animation: none; } }

        .brand { text-align: center; margin-bottom: 24px; }
        .brand-mark {
            width: 54px; height: 54px; margin: 0 auto 12px;
            border-radius: 16px;
            background: var(--primary-grad);
            color: var(--on-primary);
            display: flex; align-items: center; justify-content: center;
        }
        .brand-mark svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
        .brand h1 { font-size: 1.5rem; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
        .brand p { margin: 4px 0 0; color: var(--text-sub); font-size: 0.92rem; }

        /* login / register switch */
        .segmented { display: flex; background: var(--surface-2); border-radius: 14px; padding: 4px; margin-bottom: 22px; }
        .segmented button {
            flex: 1; border: none; background: transparent; color: var(--text-sub);
            padding: 9px; border-radius: 10px; font-weight: 600; font-size: 0.92rem;
            transition: background 0.2s, color 0.2s;
        }
        .segmented button.active { background: var(--surface); color: var(--text); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); }

        .field { margin-bottom: 16px; }

        .msg { margin: 16px 0 0; padding: 10px 14px; border-radius: 10px; font-size: 0.9rem; text-align: center; display: none; }
        .msg.error { display: block; color: var(--danger); background: rgba(217, 58, 58, 0.1); }
        .msg.success { display: block; color: var(--success); background: rgba(31, 157, 85, 0.12); }
    </style>
</head>
<body>

<!-- icons used by the background doodles (drawn once, reused below) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <g id="pizza" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 14 Q32 2 56 14 L32 60 Z"/>
            <circle cx="26" cy="24" r="3.5"/><circle cx="38" cy="26" r="3.5"/><circle cx="32" cy="40" r="3.5"/>
        </g>
        <g id="burger" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 26 Q10 10 32 10 Q54 10 54 26 Z"/>
            <path d="M10 34 q5 5 10 0 t10 0 t10 0 t14 0"/>
            <path d="M10 44 H54 Q54 54 44 54 H20 Q10 54 10 44 Z"/>
        </g>
        <g id="cup" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 20 H46 L42 56 H22 Z"/><path d="M16 20 H48"/><path d="M36 20 L40 6 H50"/>
        </g>
        <g id="bowl" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 32 H56 Q56 54 32 54 Q8 54 8 32 Z"/>
            <path d="M22 24 q-4 -5 0 -10 M32 24 q-4 -5 0 -10 M42 24 q-4 -5 0 -10"/>
        </g>
        <g id="donut" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="32" cy="32" r="21"/><circle cx="32" cy="32" r="7"/>
            <path d="M18 24 l4 2 M44 20 l-3 3 M46 40 l-4 -2 M24 46 l2 -4"/>
        </g>
    </defs>
</svg>

<!-- decorative food pattern -->
<div class="food-bg" aria-hidden="true">
    <svg class="food" viewBox="0 0 64 64" style="top:6%;  left:7%;  width:90px;  transform:rotate(-14deg)"><use href="#pizza"/></svg>
    <svg class="food" viewBox="0 0 64 64" style="top:12%; left:30%; width:64px;  transform:rotate(10deg)"><use href="#donut"/></svg>
    <svg class="food" viewBox="0 0 64 64" style="top:5%;  left:62%; width:84px;  transform:rotate(12deg)"><use href="#burger"/></svg>
    <svg class="food" viewBox="0 0 64 64" style="top:16%; left:86%; width:74px;  transform:rotate(-8deg)"><use href="#cup"/></svg>
    <svg class="food" viewBox="0 0 64 64" style="top:42%; left:4%;  width:80px;  transform:rotate(8deg)"><use href="#bowl"/></svg>
    <svg class="food" viewBox="0 0 64 64" style="top:48%; left:90%; width:88px;  transform:rotate(-12deg)"><use href="#pizza"/></svg>
    <svg class="food" viewBox="0 0 64 64" style="top:78%; left:9%;  width:76px;  transform:rotate(-10deg)"><use href="#cup"/></svg>
    <svg class="food" viewBox="0 0 64 64" style="top:86%; left:28%; width:86px;  transform:rotate(12deg)"><use href="#burger"/></svg>
    <svg class="food" viewBox="0 0 64 64" style="top:80%; left:58%; width:70px;  transform:rotate(-6deg)"><use href="#donut"/></svg>
    <svg class="food" viewBox="0 0 64 64" style="top:84%; left:82%; width:84px;  transform:rotate(10deg)"><use href="#bowl"/></svg>
</div>

<div class="top-actions">
    <button class="theme-btn" data-theme-toggle aria-label="Switch light or dark mode" title="Switch theme">
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
</div>

<main class="auth-card">
    <div class="brand">
        <div class="brand-mark">
            <!-- little bag icon -->
            <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>
        </div>
        <h1>QuickBite Lanka</h1>
        <p id="subtitle">Welcome back. What are you craving today?</p>
    </div>

    <!-- login / register switch -->
    <div class="segmented" role="tablist">
        <button type="button" class="active" id="loginTab" onclick="switchView('login')">Log in</button>
        <button type="button" id="regTab" onclick="switchView('register')">Register</button>
    </div>

    <!-- Login Form -->
    <div id="loginForm">
        <div class="field">
            <label class="field-label" for="loginEmail">Email address</label>
            <input type="email" id="loginEmail" class="form-control" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
            <label class="field-label" for="loginPw">Password</label>
            <input type="password" id="loginPw" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
        </div>
        <button onclick="attemptLogin()" class="btn-brand">Log in</button>
    </div>

    <!-- Register Form -->
    <div id="regForm" style="display: none;">
        <div class="row g-3 mb-3">
            <div class="col-6">
                <label class="field-label" for="regFirst">First name</label>
                <input type="text" id="regFirst" class="form-control" autocomplete="given-name" required>
            </div>
            <div class="col-6">
                <label class="field-label" for="regLast">Last name</label>
                <input type="text" id="regLast" class="form-control" autocomplete="family-name" required>
            </div>
        </div>
        <div class="field">
            <label class="field-label" for="regEmail">Email address</label>
            <input type="email" id="regEmail" class="form-control" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
            <label class="field-label" for="regPw">Password</label>
            <input type="password" id="regPw" class="form-control" placeholder="Create a password" autocomplete="new-password" required>
        </div>
        <button onclick="attemptRegister()" class="btn-brand">Create account</button>
    </div>

    <p id="msg" class="msg" role="alert"></p>
</main>

<script>
    // flip between the login and register forms
    function switchView(view) {
        hideMsg();
        const isLogin = view === 'login';
        document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
        document.getElementById('regForm').style.display = isLogin ? 'none' : 'block';
        document.getElementById('loginTab').classList.toggle('active', isLogin);
        document.getElementById('regTab').classList.toggle('active', !isLogin);
        document.getElementById('subtitle').innerText = isLogin
            ? 'Welcome back. What are you craving today?'
            : 'Create an account and start ordering.';
    }

    async function attemptLogin() {
        const email = document.getElementById('loginEmail').value;
        const pw = document.getElementById('loginPw').value;
        if (!email || !pw) return showErr("Please fill in both fields");

        try {
            const loginRes = await fetch('http://localhost:8080/api/users/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: pw })
            });

            if (!loginRes.ok) return showErr("Invalid email or password.");

            const userData = await loginRes.json();
            const activeId = userData.id || userData.userId;

            if (!activeId) return showErr("Critical error: User ID not found.");

            // only the basics are saved here. Roles are checked with the server on every page,
            // so an old login can never keep old permissions
            localStorage.setItem('user', JSON.stringify({
                id: activeId,
                name: userData.firstName,
                role: 'USER',
                isSuperAdmin: false,
                isSupport: false
            }));

            window.location.href = 'home.html';
        } catch (e) {
            showErr("Server connection error.");
        }
    }

    async function attemptRegister() {
        const first = document.getElementById('regFirst').value;
        const last = document.getElementById('regLast').value;
        const email = document.getElementById('regEmail').value;
        const pw = document.getElementById('regPw').value;

        if (!first || !last || !email || !pw) return showErr("Please fill out all fields");

        try {
            const res = await fetch('http://localhost:8080/api/users/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ firstName: first, lastName: last, email: email, password: pw })
            });

            if (res.ok) {
                // pre-fill the login form to save them a step
                document.getElementById('loginEmail').value = email;
                document.getElementById('loginPw').value = '';
                switchView('login');
                showMsg(`Account created for ${first}. You can log in now.`, 'success');
            } else {
                showErr("Registration failed. Email might already be in use.");
            }
        } catch (e) {
            showErr("Server connection error during registration.");
        }
    }

    // small helpers for the message box under the form
    function showMsg(text, type) {
        const box = document.getElementById('msg');
        box.innerText = text;
        box.className = 'msg ' + type;
    }
    function showErr(text) { showMsg(text, 'error'); }
    function hideMsg() { document.getElementById('msg').className = 'msg'; }

    // pressing Enter submits whichever form is showing
    document.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        const loginVisible = document.getElementById('loginForm').style.display !== 'none';
        loginVisible ? attemptLogin() : attemptRegister();
    });
</script>
</body>
</html>
